## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: '>=4.1.0'
  ## Use THIS repo (the flippin-balls fork, with the ATECC I2C fixes) as the
  ## library, not the upstream registry component. Same pattern upstream later
  ## adopted. Without override_path the utility firmware silently links the
  ## un-fixed registry library.
  esp-cryptoauthlib:
    version: "*"
    override_path: "../../../"
